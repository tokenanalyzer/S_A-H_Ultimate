name: S_A-H ULTIMATE — Android APK Build

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/audit-dashboard/src/**'
      - 'artifacts/api-server/src/**'
      - 'lib/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    # ── Secrets are stored in GitHub repo Settings → Secrets → Actions ──────
    # Add each key there: GROQ_API_KEY, SAMBANOVA_API_KEY, GEMINI_API_KEY,
    # GITHUB_TOKEN, SESSION_SECRET, DATABASE_URL
    env:
      GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
      SESSION_SECRET:    ${{ secrets.SESSION_SECRET }}
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      NODE_ENV:          production
      BASE_PATH:         /

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js + pnpm ───────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 3. Build Vite web bundle ─────────────────────────────────────────
      - name: Build web assets
        run: NODE_ENV=production BASE_PATH=/ pnpm --filter @workspace/audit-dashboard run build

      # ── 4. Java 17 ───────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 5. Android SDK ───────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses || true

      # ── 6. Capacitor: add + sync android ────────────────────────────────
      - name: Capacitor — add android platform
        working-directory: artifacts/audit-dashboard
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android/ already present"
          fi

      - name: Capacitor — sync web assets
        working-directory: artifacts/audit-dashboard
        run: npx cap sync android

      # ── 7. Gradle cache ──────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Set gradlew permissions
        working-directory: artifacts/audit-dashboard/android
        run: chmod +x gradlew

      # ── 8. Build APK ─────────────────────────────────────────────────────
      - name: Build debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        working-directory: artifacts/audit-dashboard/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: artifacts/audit-dashboard/android
        run: ./gradlew assembleRelease --no-daemon

      # ── 9. Upload artifact ───────────────────────────────────────────────
      - name: Upload debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: sah-ultimate-debug-${{ github.run_number }}
          path: artifacts/audit-dashboard/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: sah-ultimate-release-${{ github.run_number }}
          path: artifacts/audit-dashboard/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      # ── 10. Build summary ────────────────────────────────────────────────
      - name: Print APK info
        run: |
          echo "## S_A-H ULTIMATE APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| App ID | com.sah.ultimatedashboard |" >> $GITHUB_STEP_SUMMARY
          echo "| Build # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Profile | ${{ github.event.inputs.build_type || 'debug' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY
